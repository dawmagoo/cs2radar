name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'electron-main.js'
      - 'preload.js'
      - 'server.js'
      - 'cstv.js'
      - 'telemetry.js'
      - 'map-store.js'
      - 'lan-sharing.js'
      - 'public/**'
      - '.github/workflows/windows-installer.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build Windows installer
        run: npm run dist:win
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CS2-WebRadar-Windows-Installer
          path: dist/*Setup*.exe
          if-no-files-found: error
          retention-days: 30
